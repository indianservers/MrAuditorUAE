[project]
name = "auditos-uae"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5",
    "celery[redis]>=5.4",
    "argon2-cffi>=23",
    "PyJWT>=2.10",
    "httpx>=0.28",
    "email-validator>=2",
    "python-multipart>=0.0.20",
    "pycountry>=26.2.16",
    "openpyxl>=3.1.5",
    "duckdb>=1.5.6",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "boto3>=1.43.114",
    "babel>=2.18.0",
    "psutil>=7.2.2",
    "keyring>=25.7.0",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    "pypdf>=6,<7",
    "rapidocr>=3,<4",
    "onnxruntime>=1.20,<2",
    "pypdfium2>=4.30,<6",
    "pillow>=11,<13",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "pre-commit>=4"]
[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
