x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
  DATABASE_URL: postgresql+asyncpg://auditos:${POSTGRES_PASSWORD}@postgres:5432/auditos
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1","backend"]}'
  CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
  SOURCE_STORAGE_PATH: /srv/backend/source-objects
  SOURCE_S3_BUCKET: ${SOURCE_S3_BUCKET:-}
  SOURCE_S3_REGION: ${SOURCE_S3_REGION:-me-central-1}
  SOURCE_KMS_KEY: ${SOURCE_KMS_KEY:-}
  ZOHO_REDIRECT_URIS: '${ZOHO_REDIRECT_URIS:-["http://localhost:8000/oauth/zoho"]}'
  FINANCIAL_AI_HOURLY_REQUESTS: ${FINANCIAL_AI_HOURLY_REQUESTS:-20}
  CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-}
  CONNECTOR_ALLOWED_ORIGINS: '${CONNECTOR_ALLOWED_ORIGINS:-[]}'
  CONNECTOR_REDIRECT_URIS: '${CONNECTOR_REDIRECT_URIS:-[]}'
  CONNECTOR_QUICKBOOKS_WEBHOOK_TOKEN: ${CONNECTOR_QUICKBOOKS_WEBHOOK_TOKEN:-}
  EVIDENCE_DIRECTORY: /srv/backend/test-evidence
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auditos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-database.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditos"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: ./backend
    volumes: ["source_objects:/srv/backend/source-objects"]
    environment: *app-environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      AUDITOS_API_ORIGIN: http://backend:8000
      AUDITOS_WEB_ORIGIN: ${AUDITOS_WEB_ORIGIN:-http://127.0.0.1:3000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    volumes: ["source_objects:/srv/backend/source-objects"]
    environment: *app-environment
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "celery,grc,enterprise-ai", "--loglevel=WARNING", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  source_objects:
  postgres_data:
  redis_data:
