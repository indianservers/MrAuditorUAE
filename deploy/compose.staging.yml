# TEMPLATE ONLY: requires an authorized isolated staging account and injected secrets.
name: auditos-staging
x-env: &env
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?Private non-superuser PostgreSQL URL required}
  REDIS_URL: ${REDIS_URL:?Private TLS Redis URL required}
  JWT_SECRET: ${JWT_SECRET:?Inject signing secret}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Inject independent Fernet key}
  CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?Inject independent Fernet key}
  BOOTSTRAP_SECRET: ""
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Explicit host JSON array required}
  CORS_ORIGINS: "[]"
  SOURCE_S3_BUCKET: ${SOURCE_S3_BUCKET:?Private staging bucket required}
  SOURCE_S3_REGION: me-central-1
  SOURCE_KMS_KEY: ${SOURCE_KMS_KEY:?KMS key required}
  EVIDENCE_CLAMAV_HOST: scanner
  SYNTHETIC_DATA_ENABLED: "false"
  RELEASE_ID: ${RELEASE_ID:?Immutable release identifier required}
services:
  migrate:
    image: ${BACKEND_IMAGE:?Use verified immutable image digest}
    environment: *env
    command: ["alembic","upgrade","head"]
    restart: "no"
  backend:
    image: ${BACKEND_IMAGE}
    environment: *env
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      scanner: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: ${BACKEND_IMAGE}
    environment: *env
    command: ["celery","-A","app.workers.celery_app:celery_app","worker","-Q","celery,grc,enterprise-ai","--concurrency=2","--loglevel=WARNING"]
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      scanner: {condition: service_healthy}
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    image: ${BACKEND_IMAGE}
    environment: *env
    command: ["celery","-A","app.workers.celery_app:celery_app","beat","--schedule=/tmp/celerybeat","--pidfile=/tmp/beat.pid","--loglevel=WARNING"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    # Exactly one scheduler per environment. Never scale this service horizontally.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib; os.kill(int(pathlib.Path('/tmp/beat.pid').read_text()),0)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    image: ${FRONTEND_IMAGE:?Use verified immutable image digest}
    environment:
      AUDITOS_API_ORIGIN: http://backend:8000
      AUDITOS_WEB_ORIGIN: https://${PUBLIC_HOST:?Authorized staging hostname required}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: {condition: service_healthy}
  scanner:
    image: clamav/clamav:stable
    volumes: ["clamav_signatures:/var/lib/clamav"]
    healthcheck:
      test: ["CMD","clamdscan","--ping","3"]
      interval: 30s
      timeout: 10s
      retries: 20
    # Pin a scanned digest after staging qualification; no public clamd port.
  edge:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: ["443:443", "80:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "tls_data:/data"]
    depends_on: [frontend]
volumes:
  clamav_signatures:
  tls_data:
