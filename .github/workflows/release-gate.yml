name: Manual release evidence gate
on:
  workflow_dispatch:
    inputs:
      evidence_artifact:
        description: Reviewed repository-relative version-2 release manifest
        required: true
      source_commit:
        description: Reviewed immutable source commit for the selected image
        required: true
      target_environment:
        description: Exact reviewed target environment identifier
        required: true
      image_digest:
        description: Verified immutable image digest
        required: true
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate reviewed artifact evidence
        env:
          RELEASE_EVIDENCE_MANIFEST: ${{ inputs.evidence_artifact }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: >-
          python scripts/release_gate.py "$RELEASE_EVIDENCE_MANIFEST"
          --commit "$RELEASE_SOURCE_COMMIT"
          --image-digest "$RELEASE_IMAGE_DIGEST"
          --environment "$RELEASE_TARGET_ENVIRONMENT"
      # No deploy step. Deployment requires a separate explicitly authorized workflow,
      # environment approvals, immutable images, and tested rollback/restore evidence.
